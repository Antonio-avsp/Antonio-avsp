<text x="30" y="120" class="l" style="animation-delay:0.20s" xml:space="preserve"><tspan fill="#7ee787">backend</tspan><tspan fill="#8b949e">:      </tspan><tspan fill="#c9d1d9">[</tspan><tspan fill="#a5d6ff">Node.js</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">Express</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">Python</tspan><tspan fill="#c9d1d9">]</tspan></text>
<text x="30" y="150" class="l" style="animation-delay:0.32s" xml:space="preserve"><tspan fill="#7ee787">frontend</tspan><tspan fill="#8b949e">:     </tspan><tspan fill="#c9d1d9">[</tspan><tspan fill="#a5d6ff">HTML</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">CSS</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">JavaScript</tspan><tspan fill="#c9d1d9">]</tspan></text>
