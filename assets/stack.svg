<text x="30" y="270" class="l" style="animation-delay:0.80s" xml:space="preserve"><tspan fill="#7ee787">metodologias</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c9d1d9">[</tspan><tspan fill="#a5d6ff">Scrum</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">Kanban</tspan><tspan fill="#c9d1d9">]</tspan></text>
