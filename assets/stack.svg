<text x="30" y="330" class="l" style="animation-delay:1.04s" xml:space="preserve"><tspan fill="#7ee787">soft_skills</tspan><tspan fill="#8b949e">:  </tspan><tspan fill="#c9d1d9">[</tspan><tspan fill="#a5d6ff">Comunicação</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">Trabalho em equipe</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">Oratória</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">Pensamento analítico</tspan><tspan fill="#c9d1d9">]</tspan></text>
