<text x="30" y="210" class="l" style="animation-delay:0.56s" xml:space="preserve"><tspan fill="#7ee787">infra_deploy</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c9d1d9">[</tspan><tspan fill="#a5d6ff">Render</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">Vercel</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">Aiven</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">Cloudinary</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">TiDB</tspan><tspan fill="#c9d1d9">]</tspan></text>
